# Weekly update proposals (pull requests) for dependencies, base images and actions.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/backend", "/frontend", "/site"]
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      nestjs:
        patterns: ["@nestjs/*"]
  - package-ecosystem: docker
    directories: ["/backend", "/frontend", "/site", "/infrastructure/keycloak", "/infrastructure/backup"]
    schedule:
      interval: weekly
    # A new major version is a deliberate change, never a weekly proposal:
    # PostgreSQL's must match the server of docker-compose.prod.yml (a newer
    # pg_dump makes dumps that an older server may not restore), and Node.js
    # stays on its LTS line (odd majors are not LTS).
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
