# Deployment to the production server over SSH, started by hand from the
# Actions tab: main or a v* tag, always a commit of main whose CI succeeded.
# It needs these repository secrets (docs/technique/exploitation.md):
#   DEPLOY_HOST          address of the server (the one used for DEPLOY_KNOWN_HOSTS)
#   DEPLOY_USER          account that runs the stack (ubuntu)
#   DEPLOY_SSH_KEY       private key dedicated to this workflow, authorized on the server
#   DEPLOY_KNOWN_HOSTS   the server's host key, checked by hand once
# and, optionally, the repository variable API_HOST for a final public check.
name: Déploiement

on:
  workflow_dispatch:
    inputs:
      ref:
        description: main, ou une étiquette v* (un commit de main dont l'intégration continue a réussi)
        required: true
        default: main

permissions:
  contents: read
  # Reads the CI runs of the commit to deploy.
  actions: read

# One deployment at a time, never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Vérifier la version et son intégration continue
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          if ! [[ "$REF" == main || "$REF" =~ ^v[0-9][A-Za-z0-9._-]{0,50}$ ]]; then
            echo "Version invalide : $REF (main ou une étiquette v*)." >&2
            exit 1
          fi
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)"
          successes="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=success&per_page=1" --jq .total_count)"
          if [ "$successes" = 0 ]; then
            echo "Aucune intégration continue réussie pour $sha : déploiement refusé." >&2
            exit 1
          fi
          echo "$REF = $sha, intégration continue réussie."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Préparer la clé SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Déployer
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_ACCOUNT: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          # The key only runs infrastructure/server/ci-deploy.sh on the server:
          # it checks that this commit belongs to main, then deploys it.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 "$DEPLOY_ACCOUNT@$DEPLOY_HOST" "$SHA"

      - name: Vérifier l'API publique
        # API_HOST: repository variable (Settings > Secrets and variables > Actions > Variables).
        if: ${{ vars.API_HOST != '' }}
        env:
          API_HOST: ${{ vars.API_HOST }}
        run: curl -fsS --retry 5 --retry-delay 5 "https://$API_HOST/health"
