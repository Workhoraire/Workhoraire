# Continuous integration: every pull request and every push on main runs the
# tests, checks the infrastructure files and builds every Docker image
# (without pushing). Not every push of a feature branch: with its pull request
# open, that would run everything twice, and a private repository has 2,000
# free minutes a month (GitHub Free). The deployment workflow only deploys a
# commit whose CI succeeded.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: API (unitaires + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workhoraire
          POSTGRES_PASSWORD: workhoraire
          POSTGRES_DB: workhoraire_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhoraire -d workhoraire_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      E2E_DATABASE_URL: postgresql://workhoraire:workhoraire@localhost:5432/workhoraire_e2e?schema=public
      DATABASE_URL: postgresql://workhoraire:workhoraire@localhost:5432/workhoraire_e2e?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npx jest --config test/jest-e2e.config.cjs --runInBand
      - run: npm run build

  frontend:
    name: Application (tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false --browsers=ChromeHeadless
      - run: npx ng build

  site:
    name: Site vitrine (tests + build prérendu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false --browsers=ChromeHeadless
      - run: npm run build

  infra:
    name: Infrastructure (Compose, scripts, Caddy, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Fichiers Compose
        run: |
          docker compose --env-file .env.example config -q
          docker compose -f docker-compose.prod.yml --env-file .env.production.example config -q
          docker compose -f docker-compose.prod.yml -f docker-compose.prod.local.yml \
            --env-file .env.production.example config -q
      - name: Scripts shell
        run: |
          for script in infrastructure/server/*.sh; do bash -n "$script"; done
          for script in infrastructure/backup/*.sh infrastructure/postgres/init-prod/*.sh frontend/docker/entrypoint.sh; do
            sh -n "$script"
          done
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -S warning \
            infrastructure/server/*.sh infrastructure/backup/*.sh \
            infrastructure/postgres/init-prod/*.sh frontend/docker/entrypoint.sh
      - name: Configurations Caddy
        run: |
          docker run --rm -v "$PWD:/w:ro" \
            -e ACME_EMAIL=ci@example.com -e SITE_HOST=example.com -e APP_HOST=app.example.com \
            -e API_HOST=api.example.com -e AUTH_HOST=auth.example.com \
            caddy:2-alpine sh -c 'for file in /w/infrastructure/caddy/Caddyfile /w/frontend/docker/Caddyfile /w/site/docker/Caddyfile; do caddy validate --config "$file" --adapter caddyfile || exit 1; done'
      - name: Workflows GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  images:
    name: Images Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, site, infra]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            target: runtime
          - name: migrate
            context: backend
            target: migrate
          - name: app
            context: frontend
            target: ""
          - name: site
            context: site
            target: ""
          - name: keycloak
            context: infrastructure/keycloak
            target: ""
          - name: backup
            context: infrastructure/backup
            target: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
