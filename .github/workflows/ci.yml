# Continuous integration: every pull request and every push on main or a
# feature branch runs the tests and builds every Docker image (without pushing).
name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: API (unitaires + e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workhoraire
          POSTGRES_PASSWORD: workhoraire
          POSTGRES_DB: workhoraire_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhoraire -d workhoraire_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      E2E_DATABASE_URL: postgresql://workhoraire:workhoraire@localhost:5432/workhoraire_e2e?schema=public
      DATABASE_URL: postgresql://workhoraire:workhoraire@localhost:5432/workhoraire_e2e?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npx jest --config test/jest-e2e.config.cjs --runInBand
      - run: npm run build

  frontend:
    name: Application (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false --browsers=ChromeHeadless
      - run: npx ng build

  site:
    name: Site vitrine (tests + build prérendu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false --browsers=ChromeHeadless
      - run: npm run build

  images:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend, site]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            target: runtime
          - name: migrate
            context: backend
            target: migrate
          - name: app
            context: frontend
            target: ""
          - name: site
            context: site
            target: ""
          - name: keycloak
            context: infrastructure/keycloak
            target: ""
          - name: backup
            context: infrastructure/backup
            target: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
